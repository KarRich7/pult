name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Ensure Node in Xcode PATH
        run: |
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(which node)" /usr/local/bin/node || true
          echo "NODE_BINARY=$(which node)" >> $GITHUB_ENV
          echo "Node version: $(node -v)"
          echo "Node path: $(which node)"

      - name: Select Xcode 16 / 15
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install npm dependencies
        run: npm ci

      - name: Patch Expo Packages for Swift 6.0 Compatibility
        run: |
          node scripts/patch-swift6.js

      - name: Expo Prebuild (Generate native iOS project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: Ensure CocoaPods Dependencies
        run: |
          cd ios
          pod install || pod install --repo-update
          cd ..

      - name: Re-apply Swift 6.0 Patches after Prebuild
        run: |
          node scripts/patch-swift6.js

      - name: Configure Xcode Project for Ad-Hoc Signing
        run: |
          # 1. Switch to Manual code signing and Ad-Hoc identity everywhere
          find ios -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} + || true
          find ios -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "-";/g' {} + || true
          find ios -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' {} + || true
          find ios -name "project.pbxproj" -exec sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' {} + || true
          find ios -name "project.pbxproj" -exec sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' {} + || true
          find ios -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} + || true

          # 2. Prevent Xcode from building test bundles during the release build
          find ios -name "*.xcscheme" -exec sed -i '' 's/buildForTesting = "YES"/buildForTesting = "NO"/g' {} + || true

      - name: Build iOS App (.app)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          PROJECT=$(find ios -name "*.xcodeproj" -maxdepth 1 | head -n 1)
          echo "Found workspace: $WORKSPACE"
          echo "Found project: $PROJECT"
          
          # List all workspace schemes
          echo "=== All Available Schemes ==="
          xcodebuild -workspace "$WORKSPACE" -list
          
          # Get the main app scheme from the .xcodeproj
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | jq -r '.project.schemes[0]')
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "null" ]; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '[.workspace.schemes[] | select(startswith("Pods-") | not)][0]')
          fi
          echo "===> Selected Target App Scheme: $SCHEME <==="

          mkdir -p build/DerivedData

          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            build 2>&1 | tee build/xcodebuild.log || {
              echo "==================== XCODEBUILD FAILED ===================="
              tail -n 150 build/xcodebuild.log
              exit 1
            }

      - name: Package into IPA
        run: |
          echo "=== Searching for .app bundles in build directory ==="
          find build -name "*.app" -type d -ls || true

          APP_DIR=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Compiled app bundle: $APP_DIR"
          
          if [ -z "$APP_DIR" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_DIR" build/Payload/
          
          cd build
          zip -r -q "PhilipsRemote.ipa" Payload
          shasum -a 256 "PhilipsRemote.ipa" > "PhilipsRemote.ipa.sha256"
          echo "Created PhilipsRemote.ipa successfully."
          ls -lh PhilipsRemote.ipa
          cat PhilipsRemote.ipa.sha256
          cd ..

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcodebuild-Log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhilipsRemote-iOS-IPA
          path: |
            build/PhilipsRemote.ipa
            build/PhilipsRemote.ipa.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/PhilipsRemote.ipa
            build/PhilipsRemote.ipa.sha256
          name: ${{ github.ref_name || 'Philips Remote iOS Build' }}
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ### 📱 Philips Remote iOS IPA
            
            Автономная сборка для iPhone (Philips 46PFL8606H / JointSpace TV).
            
            **Установка на iPhone:**
            - **TrollStore:** Устанавливается напрямую в 1 клик.
            - **AltStore / Sideloadly / Scarlet / ESign:** Скачайте файл `.ipa` и установите через кабель или Wi-Fi (программа автоматически подпишет приложение вашим бесплатным Apple ID).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

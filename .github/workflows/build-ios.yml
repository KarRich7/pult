name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Select Xcode 16 / 15
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install npm dependencies
        run: npm ci

      - name: Expo Prebuild (Generate native iOS project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: Ensure CocoaPods Dependencies
        run: |
          cd ios
          pod install || pod install --repo-update
          cd ..

      - name: Configure Xcode Project for Unsigned Build
        run: |
          # Disable automatic signing requirements in project.pbxproj
          find ios -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} + || true
          find ios -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' {} + || true

      - name: Build iOS App (.app)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          echo "Found workspace: $WORKSPACE"
          
          # Detect the main scheme
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '.workspace.schemes[0]')
          echo "Selected scheme: $SCHEME"

          mkdir -p build/DerivedData

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            build

      - name: Package into IPA
        run: |
          APP_DIR=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Compiled app bundle: $APP_DIR"
          
          if [ -z "$APP_DIR" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_DIR" build/Payload/
          
          cd build
          zip -r -q "PhilipsRemote.ipa" Payload
          shasum -a 256 "PhilipsRemote.ipa" > "PhilipsRemote.ipa.sha256"
          echo "Created PhilipsRemote.ipa successfully."
          ls -lh PhilipsRemote.ipa
          cat PhilipsRemote.ipa.sha256
          cd ..

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhilipsRemote-iOS-IPA
          path: |
            build/PhilipsRemote.ipa
            build/PhilipsRemote.ipa.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/PhilipsRemote.ipa
            build/PhilipsRemote.ipa.sha256
          name: ${{ github.ref_name || 'Philips Remote iOS Build' }}
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ### 📱 Philips Remote iOS IPA
            
            Автономная сборка для iPhone (Philips 46PFL8606H / JointSpace TV).
            
            **Установка на iPhone:**
            - **TrollStore:** Устанавливается напрямую в 1 клик.
            - **AltStore / Sideloadly / Scarlet / ESign:** Скачайте файл `.ipa` и установите через кабель или Wi-Fi (программа автоматически подпишет приложение вашим бесплатным Apple ID).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
